name: Build Loop unsigned IPA

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch of LoopWorkspace to build
        required: true
        default: dev
        type: choice
        options:
          - dev
          - main

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Checkout LoopWorkspace and dependencies
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_branch }}
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build unsigned archive
        run: xcodebuild archive -workspace LoopWorkspace.xcworkspace -scheme LoopWorkspace -configuration Release -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Loop.xcarchive" DEVELOPMENT_TEAM=UNSIGNED LOOP_DEVELOPMENT_TEAM=UNSIGNED CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO PROVISIONING_PROFILE_SPECIFIER="" COMPILER_INDEX_STORE_ENABLE=NO -skipMacroValidation -skipPackagePluginValidation

      - name: Create IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/Loop.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip --symlinks -r "Loop-${{ inputs.source_branch }}-unsigned.ipa" Payload

      - name: Apply ESign App Group correction
        env:
          IPA_PATH: ${{ runner.temp }}/Loop-${{ inputs.source_branch }}-unsigned.ipa
          APP_GROUP: group.85bacb6ce3d56ed1.1
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, zipfile
          ipa = pathlib.Path(os.environ['IPA_PATH'])
          fixed = ipa.with_suffix('.fixed.ipa')
          changed = []
          with zipfile.ZipFile(ipa) as src, zipfile.ZipFile(fixed, 'w', compression=zipfile.ZIP_DEFLATED) as dst:
              for entry in src.infolist():
                  data = src.read(entry.filename)
                  if entry.filename.endswith('/Info.plist'):
                      info = plistlib.loads(data)
                      if info.get('AppGroupIdentifier') == 'group.com.UNSIGNED.loopkit.LoopGroup':
                          info['AppGroupIdentifier'] = os.environ['APP_GROUP']
                          fmt = plistlib.FMT_BINARY if data.startswith(b'bplist00') else plistlib.FMT_XML
                          data = plistlib.dumps(info, fmt=fmt, sort_keys=False)
                          changed.append(entry.filename)
                  dst.writestr(entry, data)
          assert len(changed) == 4, changed
          with zipfile.ZipFile(ipa) as src, zipfile.ZipFile(fixed) as dst:
              assert src.namelist() == dst.namelist()
              assert dst.testzip() is None
              assert [n for n in src.namelist() if src.read(n) != dst.read(n)] == changed
              for name in changed:
                  before = plistlib.loads(src.read(name))
                  after = plistlib.loads(dst.read(name))
                  assert after.pop('AppGroupIdentifier') == os.environ['APP_GROUP']
                  before.pop('AppGroupIdentifier')
                  assert before == after
          fixed.replace(ipa)
          print('Verified App Group correction:', *changed, sep='\n')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Loop-${{ inputs.source_branch }}-unsigned-IPA
          path: ${{ runner.temp }}/Loop-${{ inputs.source_branch }}-unsigned.ipa
          if-no-files-found: error
